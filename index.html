<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neon Starfall — Ascension</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#03050d;color:white;font-family:system-ui,Arial}
canvas{display:block;width:100%;height:100%}
#hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);font-size:12px;color:#b9c9e8;background:#071022bb;padding:8px 14px;border:1px solid #ffffff22;border-radius:20px;pointer-events:none}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hint">A/D or ←/→ Move • Space Jump • Shift Dash • E Time Pulse • F Blast • Esc Pause</div>
<script>
"use strict";
const C=document.getElementById("game"),X=C.getContext("2d");
let W=innerWidth,H=innerHeight,D=devicePixelRatio||1;
function size(){W=innerWidth;H=innerHeight;D=Math.min(D,2);C.width=W*D;C.height=H*D;X.setTransform(D,0,0,D,0,0)}addEventListener("resize",size);size();
const TAU=Math.PI*2,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
const keys={},P=[],shots=[],enemies=[],shards=[],relics=[];
let state="title",cam=0,t=0,last=performance.now(),shake=0,audio;
addEventListener("keydown",e=>{if(["Space","ArrowLeft","ArrowRight","ArrowUp"].includes(e.code))e.preventDefault();if(!keys[e.code]){if(e.code==="Space"||e.code==="KeyW"||e.code==="ArrowUp")player.jump=1;if(e.code.startsWith("Shift"))player.dash=1;if(e.code==="KeyE")player.pulse=1;if(e.code==="KeyF")player.fire=1}keys[e.code]=1;if(e.code==="Escape")state=state==="playing"?"paused":state==="paused"?"playing":state;if((e.code==="Enter"||e.code==="Space")&&(state==="title"||state==="gameover"||state==="victory"))reset();sound("ui")});
addEventListener("keyup",e=>keys[e.code]=0);
function initAudio(){if(audio)return;try{audio=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
function beep(f,d=.1,type="sine",v=.035,slide=0){initAudio();if(!audio)return;audio.resume();let o=audio.createOscillator(),g=audio.createGain(),n=audio.currentTime;o.type=type;o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g).connect(audio.destination);o.start();o.stop(n+d+.02)}
function sound(s){if(s==="jump"){beep(450,.08,"square",.04,300)}if(s==="coin"){beep(900,.07,"sine",.04,300);setTimeout(()=>beep(1300,.1,"sine",.025),50)}if(s==="dash")beep(120,.14,"sawtooth",.05,700);if(s==="blast")beep(180,.12,"square",.035,600);if(s==="hit")beep(80,.18,"sawtooth",.05);if(s==="pulse")beep(160,.25,"sine",.04,1000);if(s==="boss")beep(55,.35,"sawtooth",.05);if(s==="win"){[523,659,784,1047].forEach((n,i)=>setTimeout(()=>beep(n,.2,"sine",.035),i*110))}if(s==="ui")initAudio()}

const WORLD=15000;
const platforms=[
[-500,610,1650,180],[1250,540,500,250],[1800,620,800,160],[2700,520,550,260],
[3350,620,850,160],[4300,500,620,280],[5050,620,1000,160],[6200,530,600,250],
[6950,620,900,160],[7950,470,720,310],[8800,610,1050,170],[10000,520,700,270],
[10850,620,1000,170],[12050,500,600,290],[12800,620,1300,180],[14200,540,900,260]];
const ledges=[[300,475,180,25],[650,385,220,25],[940,300,190,25],[1330,420,190,25],[1530,330,170,25],[1900,480,190,25],[2200,390,190,25],[2480,300,190,25],[2800,410,180,25],[3100,320,190,25],[3450,470,180,25],[3750,375,200,25],[4050,280,170,25],[4420,390,180,25],[4700,310,180,25],[5250,430,200,25],[5550,330,190,25],[5900,250,180,25],[6350,410,200,25],[6650,330,180,25],[7050,455,190,25],[7350,350,180,25],[7650,255,190,25],[8100,390,190,25],[8400,300,180,25],[9000,455,210,25],[9320,350,180,25],[9650,260,180,25],[10100,400,190,25],[10400,320,180,25],[11100,440,200,25],[11400,340,180,25],[11700,250,180,25],[12150,400,180,25],[12450,315,190,25],[13000,455,190,25],[13300,350,180,25],[13600,250,200,25],[14300,420,190,25],[14600,320,190,25]];
const all=platforms.concat(ledges);
for(let i=0;i<155;i++)shards.push({x:180+i*95+(Math.random()-.5)*40,y:330+(i%4)*55+Math.sin(i)*35,taken:false});
for(const q of [[1750,560],[4250,440],[8750,550],[12700,560]])relics.push({x:q[0],y:q[1],taken:false});
function burst(x,y,c,n=25,p=6){for(let i=0;i<n;i++){let a=Math.random()*TAU,s=Math.random()*p+.5;P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:20+Math.random()*35,max:55,size:1+Math.random()*4,c})}}
function particles(dt){for(let i=P.length-1;i>=0;i--){let p=P[i];p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;p.vy+=.08*dt*60;p.life-=dt*60;if(p.life<=0)P.splice(i,1)}}
function drawP(c){for(const p of P){X.globalAlpha=Math.max(0,p.life/p.max);X.fillStyle=p.c;X.shadowBlur=12;X.shadowColor=p.c;X.beginPath();X.arc(p.x-c,p.y,p.size,0,TAU);X.fill()}X.globalAlpha=1;X.shadowBlur=0}

const player={x:90,y:500,w:44,h:62,vx:0,vy:0,face:1,ground:false,coyote:0,buffer:0,jump:0,dash:0,pulse:0,fire:0,dashCD:0,pulseCD:0,fireCD:0,inv:0,lives:5,score:0,coins:0,spawnX:90,spawnY:500};
const boss={x:13900,y:220,w:190,h:190,hp:80,max:80,active:false,t:0,shots:[]};
function rect(a){return{x:a.x,y:a.y,w:a.w,h:a.h}}
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function damage(){if(player.inv>0)return;player.lives--;player.inv=1.4;shake=15;sound("hit");burst(player.x+22,player.y+30,"#ff426d",45,7);if(player.lives<=0)state="gameover";else{player.x=player.spawnX;player.y=player.spawnY;player.vx=player.vy=0}}

class Enemy{
constructor(x,type){this.x=x;this.y=430;this.w=44;this.h=44;this.type=type;this.vx=type==="charger"?2.1:1.3;this.vy=0;this.hp=type==="charger"?3:1;this.max=this.hp;this.alive=true;this.hist=[];this.t=Math.random()*10}
update(dt){if(!this.alive)return;this.t+=dt;this.hist.push([this.x,this.y]);if(this.hist.length>180)this.hist.shift();if(this.type==="flyer"){this.y=400+Math.sin(this.t*3)*65;this.x+=this.vx*dt*60}else{this.x+=this.vx*dt*60;this.vy+=.65*dt*60;this.y+=this.vy*dt*60;for(const p of all)if(this.x+44>p[0]&&this.x<p[0]+p[2]&&this.y+44>p[1]&&this.y+44<p[1]+30&&this.vy>=0){this.y=p[1]-44;this.vy=0}}if(this.x<20||this.x>WORLD-100)this.vx*=-1}
rewind(){if(this.hist.length>65){let q=this.hist[this.hist.length-65];this.x=q[0];this.y=q[1];burst(this.x+22,this.y+22,"#55eaff",16,3)}}
draw(c){if(!this.alive)return;let x=this.x-c,y=this.y;X.save();X.translate(x+22,y+22);X.rotate(this.t*1.5);X.shadowBlur=22;X.shadowColor=this.type==="charger"?"#ff8844":"#b85cff";X.fillStyle=this.type==="charger"?"#ff6b38":"#a84dff";X.beginPath();X.moveTo(0,-25);X.lineTo(25,0);X.lineTo(0,25);X.lineTo(-25,0);X.closePath();X.fill();X.rotate(-this.t*3);X.fillStyle="#06101d";X.beginPath();X.arc(-8,-4,4,0,TAU);X.arc(8,-4,4,0,TAU);X.fill();X.restore();if(this.max>1){X.fillStyle="#080b16";X.fillRect(x,y-10,44,5);X.fillStyle="#ff8844";X.fillRect(x,y-10,44*this.hp/this.max,5)}}
}
function spawn(){enemies.length=0;for(let i=0;i<43;i++)enemies.push(new Enemy(500+i*325+Math.random()*90,["drone","drone","charger","flyer"][i%4]))}spawn();

function updatePlayer(dt){
if(player.inv>0)player.inv-=dt;if(player.dashCD>0)player.dashCD-=dt;if(player.pulseCD>0)player.pulseCD-=dt;if(player.fireCD>0)player.fireCD-=dt;
let L=keys.KeyA||keys.ArrowLeft,R=keys.KeyD||keys.ArrowRight;if(L){player.vx-=.8*dt*60;player.face=-1}if(R){player.vx+=.8*dt*60;player.face=1}if(!L&&!R)player.vx*=Math.pow(.78,dt*60);player.vx=clamp(player.vx,-8.5,8.5);
if(player.ground)player.coyote=.12;else player.coyote=Math.max(0,player.coyote-dt);if(player.jump){player.buffer=.12;player.jump=0}if(player.buffer>0)player.buffer-=dt;if(player.buffer>0&&player.coyote>0){player.vy=-15;player.ground=false;player.buffer=0;player.coyote=0;sound("jump");burst(player.x+22,player.y+62,"#55eaff",20,3)}
if(player.dash){player.dash=0;if(player.dashCD<=0){player.dashCD=.9;player.dash=.12;player.vx=player.face*19;player.vy=0;sound("dash");shake=8;burst(player.x+22,player.y+30,"#ffd34d",45,8)}}
if(player.pulse){player.pulse=0;if(player.pulseCD<=0){player.pulseCD=3;sound("pulse");shake=8;burst(player.x+22,player.y+30,"#55eaff",120,10);for(const e of enemies)if(Math.abs(e.x-player.x)<750)e.rewind()}}
if(player.fire){player.fire=0;if(player.fireCD<=0){player.fireCD=.22;shots.push({x:player.x+22+player.face*30,y:player.y+28,vx:player.face*13,life:70});sound("blast")}}
if(player.dash<=0)player.vy+=.68*dt*60;else player.dash-=dt;
let old=player.y+player.h;player.x+=player.vx*dt*60;player.y+=player.vy*dt*60;player.ground=false;
for(const p of all)if(player.x+player.w>p[0]&&player.x<p[0]+p[2]&&player.y+player.h>p[1]&&old<=p[1]+12&&player.vy>=0){player.y=p[1]-player.h;player.vy=0;player.ground=true}
player.x=clamp(player.x,-100,WORLD-50);if(player.y>850)damage();
for(const c of shards)if(!c.taken&&Math.hypot(c.x-player.x,c.y-player.y)<38){c.taken=true;player.coins++;player.score+=100;sound("coin");burst(c.x,c.y,"#ffd34d",22,5)}
for(const r of relics)if(!r.taken&&Math.hypot(r.x-player.x,r.y-player.y)<60){r.taken=true;player.score+=1500;player.lives=Math.min(7,player.lives+1);sound("win");burst(r.x,r.y,"#7dffcf",80,8)}
for(const cp of [1200,3300,6200,8800,10800,12800,14200])if(player.x>cp&&player.spawnX<cp){player.spawnX=cp+20;player.spawnY=500;player.score+=500;burst(cp,500,"#7dffcf",40,6)}
for(const e of enemies)if(e.alive&&hit(rect(player),e.rect())){if(player.vy>3&&player.y+player.h<e.y+32){e.hp--;player.vy=-11;player.score+=300;burst(e.x+22,e.y+22,"#ffd34d",35,6);if(e.hp<=0)e.alive=false}else damage()}
if(player.x>13500&&!boss.active){boss.active=true;sound("boss");shake=18;burst(boss.x+95,boss.y+95,"#ff2dba",160,10)}
if(boss.active&&hit(rect(player),boss)){if(player.vy>4&&player.y+player.h<boss.y+95){boss.hp--;player.vy=-13;player.score+=800;shake=10;burst(boss.x+95,boss.y+95,"#ff2dba",45,8)}else damage()}
if(boss.hp<=0&&state==="playing"){state="victory";player.score+=25000;sound("win");burst(boss.x+95,boss.y+95,"#ffd34d",300,13)}
}
function updateBoss(dt){if(!boss.active)return;boss.t+=dt;boss.x=13900+Math.sin(boss.t*.65)*180;boss.y=230+Math.sin(boss.t*1.1)*70;let int=boss.hp<44?.62:1.1;if(Math.floor(boss.t/int)!==Math.floor((boss.t-dt)/int)){let a=Math.atan2(player.y-boss.y,player.x-boss.x);for(let k=-1;k<=1;k++){let q=a+k*.16;boss.shots.push({x:boss.x+95,y:boss.y+95,vx:Math.cos(q)*6,vy:Math.sin(q)*6,life:180})}}for(let i=boss.shots.length-1;i>=0;i--){let s=boss.shots[i];s.x+=s.vx*dt*60;s.y+=s.vy*dt*60;s.life-=dt*60;if(s.life<=0)boss.shots.splice(i,1);else if(hit(rect(player),{x:s.x-10,y:s.y-10,w:20,h:20})){damage();boss.shots.splice(i,1)}}}

function sky(c){
let g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,"#030817");g.addColorStop(.55,"#11114b");g.addColorStop(1,"#24103c");X.fillStyle=g;X.fillRect(0,0,W,H);
for(let i=0;i<230;i++){let x=(i*173-c*.08)%W;if(x<0)x+=W;let y=(i*83)%(H*.65),r=1+i%3/2;X.globalAlpha=.3+(i%10)/15;X.fillStyle="#c8e4ff";X.beginPath();X.arc(x,y,r,0,TAU);X.fill()}X.globalAlpha=1;
X.shadowBlur=35;X.shadowColor="#7aa7ff";X.fillStyle="#e0eaff";X.beginPath();X.arc(W*.78,H*.18,70,0,TAU);X.fill();X.shadowBlur=0;
for(let l=0;l<4;l++){let base=H*(.68+l*.08),par=.12+l*.08;X.fillStyle=`rgb(${8+l*5},${15+l*5},${35+l*8})`;X.beginPath();X.moveTo(0,H);for(let z=-500;z<W+500;z+=300){let xx=z-c*par,pk=base-170-((z/300|0)%3)*55;X.lineTo(xx,base);X.lineTo(xx+150,pk);X.lineTo(xx+300,base)}X.lineTo(W,H);X.fill()}
}
function drawWorld(){
sky(cam);
for(const p of all){let x=p[0]-cam;if(x+p[2]<0||x>W)continue;let g=X.createLinearGradient(0,p[1],0,p[1]+p[3]);g.addColorStop(0,"#294064");g.addColorStop(1,"#0a1128");X.fillStyle=g;X.fillRect(x,p[1],p[2],p[3]);X.shadowBlur=18;X.shadowColor="#45eaff";X.fillStyle="#45eaff";X.fillRect(x,p[1],p[2],4);X.shadowBlur=0}
let tt=t*3;for(const c of shards)if(!c.taken){let y=c.y+Math.sin(tt+c.x)*8,x=c.x-cam;X.save();X.translate(x,y);X.rotate(t*2+c.x);X.shadowBlur=22;X.shadowColor="#ffd34d";X.fillStyle="#ffe57a";X.beginPath();X.moveTo(0,-13);X.lineTo(9,0);X.lineTo(0,13);X.lineTo(-9,0);X.fill();X.restore()}
for(const r of relics)if(!r.taken){let x=r.x-cam,y=r.y;X.save();X.translate(x,y);X.rotate(t);X.shadowBlur=30;X.shadowColor="#7dffcf";X.strokeStyle="#7dffcf";X.lineWidth=5;X.beginPath();X.arc(0,0,24,0,TAU);X.stroke();X.restore()}
for(const e of enemies)e.draw(cam);
for(const s of shots){X.shadowBlur=22;X.shadowColor="#55eaff";X.fillStyle="#efffff";X.beginPath();X.arc(s.x-cam,s.y,7,0,TAU);X.fill()}
drawBoss();drawPlayer();drawP(cam);
}
function drawBoss(){if(!boss.active)return;let x=boss.x-cam,y=boss.y;X.save();X.translate(x+95,y+95);X.shadowBlur=45;X.shadowColor="#ff2dba";X.fillStyle="#4b116d";X.beginPath();X.arc(0,0,92,0,TAU);X.fill();X.fillStyle="#ff2dba";X.beginPath();X.arc(0,0,65,0,TAU);X.fill();X.fillStyle="#080713";X.beginPath();X.arc(-27,-16,12,0,TAU);X.arc(27,-16,12,0,TAU);X.fill();X.strokeStyle="#fff";X.lineWidth=7;X.beginPath();X.arc(0,8,34,0,Math.PI);X.stroke();X.restore();X.fillStyle="#070a15";X.fillRect(x-15,y-35,220,18);X.fillStyle="#ff2dba";X.fillRect(x-15,y-35,220*boss.hp/boss.max,18);for(const s of boss.shots){X.fillStyle="#ff4dbd";X.shadowBlur=18;X.shadowColor="#ff4dbd";X.beginPath();X.arc(s.x-cam,s.y,10,0,TAU);X.fill()}}
function drawPlayer(){if(player.inv>0&&Math.floor(player.inv*14)%2===0)return;let x=player.x-cam,y=player.y;X.save();X.translate(x+22,y+31);if(player.dash>0){X.shadowBlur=30;X.shadowColor="#ffd34d";for(let i=1;i<6;i++){X.globalAlpha=.14;X.fillStyle="#ffd34d";X.beginPath();X.ellipse(-player.face*i*18,0,25,12,0,0,TAU);X.fill()}X.globalAlpha=1}X.shadowBlur=25;X.shadowColor="#55eaff";X.fillStyle="#8b43ff";X.beginPath();X.moveTo(-12,-8);X.lineTo(-48,28);X.lineTo(-7,22);X.fill();X.fillStyle="#326cff";X.beginPath();X.roundRect(-16,-5,32,35,10);X.fill();X.shadowColor="#ffbd91";X.fillStyle="#ffbd91";X.beginPath();X.arc(0,-14,19,0,TAU);X.fill();X.shadowColor="#55eaff";X.fillStyle="#3de6ff";X.beginPath();X.ellipse(0,-24,27,16,0,Math.PI,TAU);X.fill();X.fillStyle="#fff";X.beginPath();X.arc(-9,-29,5,0,TAU);X.fill();X.shadowBlur=0;X.fillStyle="#07101d";X.beginPath();X.arc(-7,-12,3,0,TAU);X.arc(7,-12,3,0,TAU);X.fill();X.fillStyle="#171a44";X.beginPath();X.ellipse(-11,31,14,8,0,0,TAU);X.ellipse(12,31,14,8,0,0,TAU);X.fill();X.restore()}
function hud(){X.fillStyle="#050917d9";X.fillRect(0,0,W,82);X.fillStyle="#fff";X.font="900 20px system-ui";X.fillText("NEON STARFALL",22,29);X.font="700 13px system-ui";X.fillStyle="#ffd34d";X.fillText("✦ "+player.coins,220,30);X.fillStyle="#fff";X.fillText("SCORE "+player.score.toLocaleString(),300,30);X.fillStyle="#ff557c";X.fillText("♥".repeat(player.lives),500,30);X.fillStyle="#8ea8d6";X.fillText("ASCENSION // SECTOR 07",22,55);X.fillText("DASH [SHIFT]   TIME PULSE [E]   BLAST [F]",W-360,55);if(boss.active){X.fillStyle="#ff2dba";X.fillText("OVERLORD",W/2-40,30)}}
function overlay(a,b){X.fillStyle="#000b";X.fillRect(0,0,W,H);X.textAlign="center";X.shadowBlur=30;X.shadowColor="#55eaff";X.fillStyle="#fff";X.font="900 68px system-ui";X.fillText(a,W/2,H*.39);X.shadowBlur=0;X.fillStyle="#adc4e8";X.font="700 18px system-ui";X.fillText(b,W/2,H*.5);X.fillStyle="#ffd34d";X.font="800 15px system-ui";X.fillText("PRESS ENTER OR SPACE",W/2,H*.59);X.textAlign="left"}

function reset(){Object.assign(player,{x:90,y:500,vx:0,vy:0,ground:false,buffer:0,coyote:0,dashCD:0,pulseCD:0,fireCD:0,inv:0,lives:5,score:0,coins:0,spawnX:90,spawnY:500});for(const c of shards)c.taken=false;for(const r of relics)r.taken=false;spawn();shots.length=0;boss.hp=80;boss.active=false;boss.t=0;boss.shots.length=0;P.length=0;state="playing";sound("win")}
function loop(now){let dt=Math.min(.033,(now-last)/1000);last=now;t+=dt;if(state==="playing"){updatePlayer(dt);for(const e of enemies)e.update(dt);for(let i=shots.length-1;i>=0;i--){let s=shots[i];s.x+=s.vx*dt*60;s.life-=dt*60;let dead=s.life<=0;for(const e of enemies)if(e.alive&&hit({x:s.x-7,y:s.y-7,w:14,h:14},e.rect())){e.hp--;dead=true;player.score+=150;burst(s.x,s.y,"#55eaff",20,5);if(e.hp<=0)e.alive=false}if(boss.active&&hit({x:s.x-7,y:s.y-7,w:14,h:14},boss)){boss.hp--;dead=true;player.score+=250;shake=5;burst(s.x,s.y,"#ff2dba",25,6)}if(dead)shots.splice(i,1)}updateBoss(dt);cam=lerp(cam,clamp(player.x-W*.35,0,WORLD-W),.1);shake*=.86}particles(dt);X.save();X.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);drawWorld();hud();X.restore();if(state==="title")overlay("NEON STARFALL","A vast neon world awaits. Explore. Master time. Defeat the Overlord.");if(state==="paused")overlay("PAUSED","The neon kingdom is frozen.");if(state==="gameover")overlay("SYSTEM FAILURE","The Starfall core has gone dark.");if(state==="victory")overlay("ASCENSION COMPLETE","The Neon Overlord has fallen. The kingdom remembers your name.");requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
</body>
</html>
